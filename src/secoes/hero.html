<section class="hero" id="topo" aria-labelledby="hero-titulo">
  <div class="hero__topo grade" data-marco="carga">
    <h1 class="hero__titulo" id="hero-titulo">
      <span class="linha"><span style="--i:0">A sua nova</span></span>
      <!-- a fibra de luz cruza o respiro entre as linhas do título (no lugar do satélite da base) e segue o mouse -->
      <span class="hero__fibra" aria-hidden="true">
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none" data-fibra>
          <path class="fibra__cabo" pathLength="1000" d="M0 50 Q500 50 1000 50"/>
          <path class="fibra__luz" pathLength="1000" d="M0 50 Q500 50 1000 50"/>
          <path class="fibra__luz fibra__luz--2" pathLength="1000" d="M0 50 Q500 50 1000 50"/>
        </svg>
      </span>
      <span class="linha"><span style="--i:1">internet<em class="ponto">.</em></span></span>
    </h1>
    <div class="hero__lado">
      <!-- símbolo oficial da Life Connect (public/simbolo.png, recortado da arte), pintado de laranja pelo CSS -->
      <span class="hero__simbolo" role="img" aria-label="Símbolo da Life Connect"></span>
      <p class="hero__frase surge" style="--i:3">Fibra óptica a partir de<br>R$&nbsp;99,90 por mês.</p>
    </div>
  </div>

  <div class="hero__pe">
    <!-- secao: cobertura id=hero -->
  </div>
</section>
